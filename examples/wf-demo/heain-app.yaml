# wf-demo: an example app that opens two capabilities to heain-workflow (the *.step contract):
# docs.issue.step (a direct call: issue a document number) and docs.render.step (a core job:
# "render" it). Used by heain-workflow's live test.
manifest_version: 1
app:
  id: wf-demo
  version: 1.0.0
  group: domain
  description: Example step app for heain-workflow -- issues a document number and renders it as a job.
  api: v1
  sdk: {name: heain-sdk-go, version: ">=1.0.0"}
capabilities:
  - {name: docs.issue.step, version: 1, formal: true, execution: direct, ai: {used: false}}
  - {name: docs.render.step, version: 1, formal: true, execution: job, ai: {used: false}}
endpoints:
  - {method: POST, path: /v1/issue, capability: docs.issue.step, formal: true}
